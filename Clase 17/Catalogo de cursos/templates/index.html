{% extends "base.html" %}
{% block titulo %}Inicio - {{ config.APP_NAME }}{% endblock %}

{% block contenido %}
<h1 class="mb-4">Catálogo de Cursos</h1>
<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    {% for curso in cursos %}
    <div class="col">
        <div class="card h-100">
            <div class="card-body d-flex flex-column">
                <h2 class="card-title h5">{{ curso.nombre }}</h2>
                <p class="card-text">{{ curso.descripcion }}</p>
                <a href="{{ url_for('curso', curso_id=curso.id) }}" class="btn btn-primary mt-auto align-self-start">
                    Ver detalles
                </a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
